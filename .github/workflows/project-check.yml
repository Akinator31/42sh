name: project_check

on:
  push:
  pull_request:

jobs:

  check_workflow_conditions:
    
    name: Check if the workflow respect correct conditions
    runs-on: ubuntu-latest
    
    steps:

      - name: Check if MIRROR_URL exist
        if: ${{ vars.MIRROR_URL == '' }}
        run: |
          echo "The variable MIRROR_URL doesn't exist !"
          exit 1
      
      - name: Check if EXECUTABLES exist
        if: ${{ vars.EXECUTABLES == '' }}
        run: |
          echo "The variable EXECUTABLES doesn't exist !"
          exit 1

      - name: Set MIRROR_REPO
        run: echo "MIRROR_REPO=$(echo ${{ vars.MIRROR_URL }} | cut -c 16- | rev | cut -c 5- | rev)" >> $GITHUB_ENV

      - name: Checkout source code
        if: ${{ github.repository == env.MIRROR_REPO }}
        run: |
          echo "You're trying to run workflow on the mirror repository !"
          exit 1

  check_coding_style:

    name: Check the coding style
    runs-on: ubuntu-latest
    needs: [check_workflow_conditions]
    if: ${{ needs.check_workflow_conditions.result == 'success' }}
    container:
      image: ghcr.io/epitech/coding-style-checker:latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4
      
      - name: Check coding style
        run: |
          check.sh $(pwd) $(pwd)
          errors_found=0

          while read -r line; do
            file=$(echo "$line" | awk -F: '{print $1}' | cut -c3-)
            line_number=$(echo "$line" | awk -F: '{print $2}')
            severity=$(echo "$line" | awk -F: '{print $3}' | awk '{print $1}')
            error_type=$(echo "$line" | awk -F: '{print $4}')

            if [ "$severity" = "INFO" ]; then
              echo "::error title="INFO coding style error",file=$file,line=$line_number::$error_type"
              errors_found=1
            elif [ "$severity" = "MINOR" ]; then
              echo "::error title="MINOR coding style error",file=$file,line=$line_number::$error_type"
              errors_found=1
            elif [ "$severity" = "MAJOR" ]; then
              echo "::error title="MAJOR coding style error",file=$file,line=$line_number::$error_type"
              errors_found=1
            fi
          done < coding-style-reports.log

          if [ $errors_found = 1 ]; then
            exit 1
          else
            exit 0
          fi

  check_program_compilation:
    
    name: Check the program compilation
    runs-on: ubuntu-latest
    needs: [check_coding_style]
    if: ${{ needs.check_coding_style.result == 'success' }}
    container:
      image: epitechcontent/epitest-docker:latest
    
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Make the project
        timeout-minutes: 2
        run: make
        working-directory: ${{ github.workspace }}
      
      - name: Clean the project
        run: make clean
        working-directory: ${{ github.workspace }}

      - name: Check executables
        run: |
          for file in $(echo "$EXECUTABLES" | tr ',' ' '); do
            if test -f "$file" || -x "$file"; then
              echo "The file $file exist and is executable"
            else
              echo "::error title="Binary not found or binary not executable",file=$file"
              exit 1
            fi
          done
  
  run_tests:
    
    name: Launch tests rule of Makefile
    runs-on: ubuntu-latest
    needs: [check_program_compilation]
    if: ${{ needs.check_program_compilation.result == 'success' }}
    container:
      image: epitechcontent/epitest-docker:latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Launch make tests_run
        timeout-minutes: 2
        run: make tests_run
        working-directory: ${{ github.workspace }}

  push_to_mirror:
    name: Push to a mirror repository
    if: ${{ github.ref_name == 'main' }}
    needs: [check_program_compilation, run_tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ env.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa $(echo ${{ vars.MIRROR_URL }} | cut -d':' -f1 | cut -d'@' -f2) >> ~/.ssh/known_hosts
        env:
          SSH_KEY: ${{ secrets.GIT_SSH_PRIVATE_KEY }}

      - name: Remove .github directory
        run: |
          git filter-branch --force --index-filter 'git rm -r --cached --ignore-unmatch .github' --prune-empty --tag-name-filter cat -- --all
          git gc --prune=now
          git clean -fd

      - name: Verify Repository
        run: |
          git fsck --full || echo "Git fsck completed with warnings"
          git gc || echo "Git gc completed with warnings"

      - name: Push to mirror
        run: |
          git remote add -f mirror ${{ vars.MIRROR_URL }}
          git push mirror --mirror --prune --force
          echo "Successfully mirrored to ${{ vars.MIRROR_URL }}"
